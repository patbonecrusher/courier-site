<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="180" y1="100" x2="860" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C9BFF"/>
      <stop offset="0.45" stop-color="#4F57EA"/>
      <stop offset="1" stop-color="#2A1D8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="210" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="512" y1="330" x2="512" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EAFF"/>
    </linearGradient>
    <linearGradient id="flap" x1="270" y1="360" x2="754" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B6CFF"/>
      <stop offset="1" stop-color="#7A4DF0"/>
    </linearGradient>
    <linearGradient id="spark" x1="666" y1="204" x2="806" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF0A8"/>
      <stop offset="0.55" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FF9A1F"/>
    </linearGradient>
    <radialGradient id="contact" cx="512" cy="738" r="300" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 605.2) scale(1 0.18)">
      <stop offset="0" stop-color="#120A52" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#120A52" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#120A52" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="env">
      <rect x="236" y="330" width="552" height="392" rx="64"/>
    </clipPath>
  </defs>

  <!-- macOS icon grid: 824pt body centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <!-- soft contact shadow under the envelope -->
  <ellipse cx="512" cy="738" rx="300" ry="54" fill="url(#contact)"/>

  <!-- envelope -->
  <rect x="236" y="330" width="552" height="392" rx="64" fill="url(#paper)"/>
  <g clip-path="url(#env)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- lower folds -->
    <path d="M214 744 L436 568" stroke="#C9D2FF" stroke-width="24"/>
    <path d="M810 744 L588 568" stroke="#C9D2FF" stroke-width="24"/>
    <!-- flap -->
    <path d="M196 322 L512 560 L828 322" stroke="url(#flap)" stroke-width="46"/>
  </g>

  <!-- sparkle: a backing star in the field colour cuts it out of the envelope.
       Both sparkles stay at least 48 units inside the body edge: macOS 26+ re-masks
       icons to its own rounder shape and clips anything closer to the edge. -->
  <g clip-path="url(#env)">
    <path d="M724 180 Q748 288 856 312 Q748 336 724 444 Q700 336 592 312 Q700 288 724 180 Z" fill="url(#bg)" stroke="url(#bg)" stroke-width="44" stroke-linejoin="round"/>
  </g>
  <path d="M724 180 Q748 288 856 312 Q748 336 724 444 Q700 336 592 312 Q700 288 724 180 Z" fill="url(#spark)"/>
  <!-- small companion sparkle -->
  <path d="M834 434 Q842 468 876 476 Q842 484 834 518 Q826 484 792 476 Q826 468 834 434 Z" fill="#FFE27A"/>
</svg>
